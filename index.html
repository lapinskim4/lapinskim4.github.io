<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lapinskim4</title>
  <meta name="description" content="Personal site of lapinskim4.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A6</text></svg>">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #7cc4ff;
      --card: #161922;
      --border: #232838;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #14171c;
        --muted: #5b6472;
        --accent: #1769c4;
        --card: #ffffff;
        --border: #e6e8ee;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main { width: 100%; max-width: 640px; }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #b07cff);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: #fff;
      flex-shrink: 0;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
    .tagline { color: var(--muted); margin: 0.15rem 0 0; font-size: 0.95rem; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    section h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    p { margin: 0.5rem 0; }
    ul.links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.5rem;
    }
    ul.links a {
      display: block;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, transform 0.15s;
    }
    ul.links a:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">L</div>
      <div>
        <h1>lapinskim4</h1>
        <p class="tagline">Hi — this is my corner of the web.</p>
      </div>
    </header>

    <section>
      <h2>About</h2>
      <p>I build things on the internet. This page is a starting point — more to come.</p>
    </section>

    <section>
      <h2>Links</h2>
      <ul class="links">
        <li><a href="https://github.com/lapinskim4">GitHub</a></li>
      </ul>
    </section>

    <footer>
      Built with plain HTML &amp; hosted on <a href="https://pages.github.com/">GitHub Pages</a>.
    </footer>
  </main>
</body>
</html>
